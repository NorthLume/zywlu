server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name __SERVER_NAME__;
    root /var/www/zywlu/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZYWLU_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    if ($host != __PRIMARY_DOMAIN__) {
        return 308 https://__PRIMARY_DOMAIN__$request_uri;
    }

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location ^~ /_astro/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }
}
